<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мои заказы — КолорМСК</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--accent:#1a2a3a;--muted:#6b7a8d;--border:#e3e8ef;--danger:#e74c3c;--ok:#2e7d4f;--warn:#b06d0f;--text:#1a2a3a;--text-light:#8a97a6}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:24px}
.t-account-wrap{max-width:860px;margin:0 auto}
.t-account-card{background:var(--card);border-radius:12px;padding:32px;border:1px solid var(--border)}
.t-account-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.t-account-title{font-size:22px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:10px}
.t-account-title svg{width:22px;height:22px;color:var(--accent)}
.t-account-close{width:36px;height:36px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:16px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit;padding:0;line-height:1}
.t-account-close:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.t-profile-info{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border)}
.t-profile-row{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text);margin-bottom:8px}
.t-profile-row:last-child{margin-bottom:0}
.t-profile-row svg{width:16px;height:16px;color:var(--muted);flex-shrink:0}
.t-profile-row strong{font-weight:600}
.t-section-title{font-size:13px;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.6px;margin:24px 0 16px;display:flex;align-items:center;gap:8px}
.t-section-title svg{width:16px;height:16px;color:var(--accent)}
.t-order{border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px;background:#fff;transition:opacity .3s}
.t-order-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.t-order-num{font-weight:700;color:var(--text);font-size:15px;letter-spacing:-.1px}
.t-order-date{font-size:13px;color:var(--muted)}
.t-order-status{font-weight:600;font-size:11px;padding:4px 12px;border-radius:6px;text-transform:uppercase;letter-spacing:.4px}
.t-status-processing{color:var(--warn);background:rgba(176,109,15,.1)}
.t-status-done{color:var(--ok);background:rgba(46,125,79,.1)}
.t-status-canceled{color:var(--danger);background:rgba(231,76,60,.1)}
.t-order-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;transition:opacity .3s}
.t-order-item:last-child{border-bottom:none;padding-bottom:0}
.t-order-item.t-removing{opacity:0}
.t-item-info{flex:1 1 240px;min-width:0;cursor:pointer;transition:opacity .15s;display:flex;gap:14px;align-items:center}
.t-item-info:hover{opacity:.75}
.t-item-photo{flex:0 0 64px;width:64px;height:64px;border-radius:8px;overflow:hidden;background:#f8faff;border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.t-item-photo img{width:100%;height:100%;object-fit:contain}
.t-item-photo-placeholder{font-size:24px;color:#c5ccd6}
.t-item-body{flex:1;min-width:0}
.t-item-name{font-size:14px;font-weight:600;color:var(--text);line-height:1.35;margin-bottom:4px}
.t-item-name:hover{color:#0d3a6b;text-decoration:underline}
.t-item-params{font-size:12px;color:var(--muted);line-height:1.4}
.t-item-sku{font-size:11px;color:var(--text-light);margin-top:2px}
.t-item-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.t-qty{display:flex;align-items:center;border:1px solid var(--border);border-radius:6px;background:#fff;overflow:hidden}
.t-qty button{width:28px;height:28px;border:none;background:transparent;cursor:pointer;font-size:14px;font-weight:600;color:var(--text);transition:background .15s;font-family:inherit;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
.t-qty button:hover:not(:disabled){background:var(--bg)}
.t-qty button:disabled{opacity:.3;cursor:not-allowed}
.t-qty span{min-width:32px;text-align:center;font-weight:600;font-size:13px;border-left:1px solid var(--border);border-right:1px solid var(--border);line-height:28px}
.t-item-price{font-weight:700;font-size:14px;min-width:90px;text-align:right;color:var(--text)}
.t-item-remove{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit;padding:0;line-height:1}
.t-item-remove:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.t-order-total{text-align:right;font-weight:600;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);font-size:14px;color:var(--muted)}
.t-order-total span{color:var(--text);font-weight:700;font-size:16px;margin-left:8px}
.t-order-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.t-btn{padding:10px 18px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
.t-btn-repeat{background:var(--accent);color:#fff}
.t-btn-repeat:hover{background:#2c3e50}
.t-empty{color:var(--muted);font-size:14px;padding:60px 20px;text-align:center}
.t-empty-icon{font-size:48px;margin-bottom:16px;color:#c5ccd6;display:flex;justify-content:center}
.t-empty-icon svg{width:64px;height:64px}
.t-back-btn{display:inline-block;padding:11px 22px;background:var(--accent);color:#fff;text-decoration:none;border-radius:8px;font-weight:600;font-size:13px;margin-top:18px;transition:background .15s}
.t-back-btn:hover{background:#2c3e50}
.t-save-indicator{position:fixed;bottom:24px;right:24px;padding:12px 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.12);opacity:0;transform:translateY(10px);transition:all .3s;z-index:99998;pointer-events:none}
.t-save-indicator.show{opacity:1;transform:translateY(0)}
.t-save-indicator.saving{background:#fff;color:var(--text);border:1px solid var(--border)}
.t-save-indicator.ok{background:var(--ok);color:#fff}
.t-save-indicator.err{background:var(--danger);color:#fff}
.t-product-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(26,42,58,.6);z-index:99999;justify-content:center;align-items:center;padding:30px;overflow-y:auto}
.t-product-modal.active{display:flex}
.t-modal-content{background:#fff;border-radius:12px;max-width:800px;width:100%;max-height:95vh;overflow-y:auto;padding:32px;position:relative;border:1px solid var(--border)}
.t-modal-close{position:sticky;top:0;float:right;background:transparent;border:none;font-size:24px;cursor:pointer;color:var(--muted);padding:0 0 0 20px;z-index:10;line-height:1}
.t-modal-brand{font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.t-modal-name{font-size:24px;font-weight:700;color:var(--text);margin:6px 0 4px;line-height:1.25}
.t-modal-sku{font-size:13px;color:var(--text-light);margin-bottom:20px}
.t-modal-grid{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:20px}
.t-modal-image{flex:0 0 220px;background:#f8faff;border-radius:10px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;height:220px;overflow:hidden}
.t-modal-image img{width:100%;height:100%;object-fit:contain}
.t-modal-info{flex:1;min-width:200px}
.t-modal-price{font-size:28px;font-weight:700;color:var(--text);margin-bottom:10px}
.t-modal-stock{font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;display:inline-block;text-transform:uppercase;letter-spacing:.4px}
.t-modal-stock.in-stock{color:var(--ok);background:rgba(46,125,79,.1)}
.t-modal-stock.on-order{color:var(--warn);background:rgba(176,109,15,.1)}
.t-modal-description{padding:16px 20px;background:#f8faff;border-radius:8px;border-left:3px solid var(--accent);margin:16px 0;font-size:14px;line-height:1.7}
.t-modal-tech{padding:16px 20px;background:#f8faff;border-radius:8px;border:1px solid var(--border);margin:12px 0;font-size:13px;line-height:1.7}
.t-modal-buy{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;padding-top:20px;border-top:1px solid var(--border);margin-top:12px}
.t-modal-buy button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:13px 28px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
.t-modal-buy button:hover{background:#2c3e50}
.t-modal-buy button:disabled{background:#c5ccd6;cursor:not-allowed}
.t-modal-loading{text-align:center;padding:60px;color:var(--muted);font-size:14px}
@media(max-width:600px){body{padding:16px 12px}.t-account-card{padding:20px}.t-account-title{font-size:19px}.t-item-photo{flex:0 0 56px;width:56px;height:56px}.t-modal-image{height:180px;flex:none;width:100%}.t-modal-name{font-size:20px}.t-order-actions{flex-direction:column}.t-order-actions .t-btn{width:100%}.t-modal-content{padding:20px}}
</style>
</head>
<body>
<div class="t-account-wrap"><div class="t-account-card">
<div class="t-account-header">
<div class="t-account-title"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>Мои заказы</div>
<button class="t-account-close" onclick="tAccountClose()" title="Закрыть">✕</button>
</div>
<div class="t-profile-info">
<div class="t-profile-row"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg><strong id="t-account-name">—</strong></div>
<div class="t-profile-row"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg><span id="t-account-email">—</span></div>
<div class="t-profile-row"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg><span id="t-account-phone">—</span></div>
</div>
<div class="t-section-title"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>История заказов</div>
<div id="t-orders-list"><div class="t-empty">Загрузка...</div></div>
</div></div>
<div class="t-save-indicator" id="t-save-indicator"></div>
<div class="t-product-modal" id="t-product-modal"><div class="t-modal-content"><button class="t-modal-close" onclick="closeProductModalAccount()">×</button><div id="t-modal-body"><div class="t-modal-loading">Загрузка товара...</div></div></div></div>
<script>
const WORKER_URL='https://colormsk-users-api.gerasimov197789.workers.dev';
const PRODUCTS_URL='https://raw.githubusercontent.com/gerasimov197789-gif/colormsk-products/main/products/';
const ORDERS_CACHE_KEY='colormsk_orders';
const CATEGORY_NAMES={'antiseptiki':'Антисептики','kraski-interiernye':'Краски интерьерные','kraski-fasadnye':'Краски фасадные','laki':'Лаки','gruntovki':'Грунтовки и Шпатлевки','dekorativnye-shtukaturki':'Декоративные штукатурки','alkidnye-kraski':'Эмали','rastvoriteli':'Растворители'};
let accountState={allOrders:[],orders:[],items:{},productCache:{}};
let saveTimer=null;
function showSaveIndicator(t,ty){const el=document.getElementById('t-save-indicator');el.textContent=t;el.className='t-save-indicator show '+(ty||'');clearTimeout(saveTimer);if(ty==='ok'||ty==='err'){saveTimer=setTimeout(()=>{el.classList.remove('show')},2000)}}
function getCurrentUser(){try{return JSON.parse(localStorage.getItem('t_current_user')||'null')}catch(e){return null}}
function tAccountClose(){window.location.href='/colormsk-test/'}
function getCachedOrders(){try{const r=localStorage.getItem(ORDERS_CACHE_KEY);return r?JSON.parse(r):[]}catch(e){return[]}}
function setCachedOrders(o){try{localStorage.setItem(ORDERS_CACHE_KEY,JSON.stringify(o))}catch(e){}}
async function loadOrdersFromWorker(){const c=getCachedOrders();fetch(WORKER_URL+'/orders').then(r=>r.ok?r.json():null).then(ro=>{if(Array.isArray(ro)&&ro.length>0){const m=[...c];ro.forEach(o=>{if(!m.find(x=>x.id===o.id))m.push(o)});setCachedOrders(m)}}).catch(e=>console.warn('Worker недоступен:',e.message));return c}
async function saveOrdersToWorker(all){setCachedOrders(all);showSaveIndicator('Сохранение...','saving');fetch(WORKER_URL+'/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(all)}).then(r=>{if(r.ok)showSaveIndicator('Сохранено','ok');else showSaveIndicator('Сохранено локально','err')}).catch(e=>{showSaveIndicator('Сохранено локально','err')});return true}
async function persistOrderUpdate(orderId){const items=accountState.items[orderId];if(!items)return;const idx=accountState.allOrders.findIndex(o=>o.id===orderId);if(idx===-1)return;const act=items.filter(it=>!it.removed).map(it=>{const{removed,...c}=it;return c});accountState.allOrders[idx].items=act;accountState.allOrders[idx].total=act.reduce((s,it)=>s+(it.price||0)*(it.qty||1),0);accountState.allOrders[idx].updatedAt=new Date().toISOString();await saveOrdersToWorker(accountState.allOrders)}
let qtyDebounceTimers={};
function changeQty(orderId,idx,delta){const items=accountState.items[orderId];if(!items||!items[idx])return;items[idx].qty=Math.max(1,items[idx].qty+delta);const qe=document.getElementById(`qty-${orderId}-${idx}`);const pe=document.getElementById(`price-${orderId}-${idx}`);const mb=document.getElementById(`minus-${orderId}-${idx}`);if(qe)qe.textContent=items[idx].qty;if(pe)pe.textContent=((items[idx].price||0)*items[idx].qty).toLocaleString('ru-RU')+' ₽';if(mb)mb.disabled=items[idx].qty<=1;const te=document.getElementById(`total-${orderId}`);if(te)te.textContent=calcOrderTotal(orderId).toLocaleString('ru-RU')+' ₽';clearTimeout(qtyDebounceTimers[orderId]);qtyDebounceTimers[orderId]=setTimeout(()=>{persistOrderUpdate(orderId)},800)}
function calcOrderTotal(orderId){const items=accountState.items[orderId]||[];return items.filter(it=>!it.removed).reduce((s,it)=>s+(it.price||0)*(it.qty||1),0)}
function removeItem(orderId,idx){const items=accountState.items[orderId];if(!items||!items[idx])return;items[idx].removed=true;const ie=document.getElementById(`item-${orderId}-${idx}`);if(ie){ie.classList.add('t-removing');setTimeout(()=>{ie.style.display='none';ie.classList.remove('t-removing')},300)}const te=document.getElementById(`total-${orderId}`);if(te)te.textContent=calcOrderTotal(orderId).toLocaleString('ru-RU')+' ₽';const rem=items.filter(it=>!it.removed).length;if(rem===0){const oe=document.getElementById(`order-${orderId}`);if(oe){setTimeout(()=>{oe.style.opacity='0.4'},300);setTimeout(()=>{oe.style.display='none'},700)}accountState.allOrders=accountState.allOrders.filter(o=>o.id!==orderId);delete accountState.items[orderId];saveOrdersToWorker(accountState.allOrders);const ro=Object.keys(accountState.items).length;if(ro===0){setTimeout(()=>{document.getElementById('t-orders-list').innerHTML='<div class="t-empty"><div class="t-empty-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg></div><div>У вас пока нет заказов</div><div style="margin-top:8px;font-size:13px;color:var(--text-light);">Оформите первый заказ из каталога</div><a href="/colormsk-test/" class="t-back-btn">Перейти в каталог</a></div>'},800)}return}persistOrderUpdate(orderId)}
function repeatOrder(orderId){const items=(accountState.items[orderId]||[]).filter(it=>!it.removed);if(items.length===0){alert('В заказе нет активных позиций.');return}let cart=[];try{cart=JSON.parse(localStorage.getItem('colormsk_cart')||'[]')}catch(e){cart=[]}items.forEach(it=>{const key=(it.sku||'')+(it.color?'|'+it.color:'')+(it.gloss?'|'+it.gloss:'');const ex=cart.find(c=>c.key===key);if(ex)ex.qty+=it.qty;else cart.push({key,brand:it.brand||'',name:it.name||'',sku:it.sku||'',price:it.price||0,color:it.color||'',gloss:it.gloss||'',volume:it.volume||'',fill:it.fill||'',photo:it.photo||'',qty:it.qty||1})});localStorage.setItem('colormsk_cart',JSON.stringify(cart));alert('Товары добавлены в корзину');window.location.href='/colormsk-test/'}
async function findProductBySku(sku){const cs=Object.keys(CATEGORY_NAMES);for(const cat of cs){try{if(!accountState.productCache[cat]){const r=await fetch(PRODUCTS_URL+cat+'.json');if(!r.ok)continue;accountState.productCache[cat]=await r.json()}const items=accountState.productCache[cat];const idx=items.findIndex(p=>p.sizes&&p.sizes.some(s=>s.options&&s.options.some(o=>o.sku===sku)));if(idx!==-1)return{category:cat,index:idx,product:items[idx]}}catch(e){continue}}return null}
async function openProductModal(sku){const modal=document.getElementById('t-product-modal');const body=document.getElementById('t-modal-body');modal.classList.add('active');document.body.style.overflow='hidden';body.innerHTML='<div class="t-modal-loading">Загрузка...</div>';const found=await findProductBySku(sku);if(!found){body.innerHTML='<div class="t-modal-loading">Товар не найден: '+sku+'</div>';return}const{category,product}=found;const firstSize=product.sizes[0];const firstOption=firstSize.options[0];const price=firstOption.price;const stock=firstOption.stock||'Много';const sc=stock==='Под заказ'?'on-order':'in-stock';const st=stock==='Под заказ'?'Под заказ':'В наличии';let h='';h+='<div class="t-modal-brand">'+(product.brand||'')+'</div>';h+='<h2 class="t-modal-name">'+(product.name||'')+'</h2>';h+='<div class="t-modal-sku">Артикул: '+firstOption.sku+' · '+(CATEGORY_NAMES[category]||category)+'</div>';h+='<div class="t-modal-grid"><div class="t-modal-image"><img src="'+(product.photo||'')+'" onerror="this.parentElement.innerHTML=\'<span style=&quot;font-size:48px;color:#c5ccd6&quot;>—</span>\'"></div><div class="t-modal-info"><div class="t-modal-price">'+price.toLocaleString('ru-RU')+' ₽</div><div class="t-modal-stock '+sc+'">'+st+'</div></div></div>';if(product.desc)h+='<div class="t-modal-description"><strong>Описание</strong><br>'+product.desc+'</div>';if(product.tech)h+='<div class="t-modal-tech"><strong>Характеристики</strong><br>'+product.tech+'</div>';h+='<div class="t-modal-buy"><div style="font-size:20px;font-weight:700;">'+price.toLocaleString('ru-RU')+' ₽</div>';if(stock==='Под заказ')h+='<button disabled>Под заказ</button>';else{const sB=(product.brand||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');const sN=(product.name||'').replace(/'/g,"\\'").replace(/"/g,'&quot;');const sC=(firstOption.color||'').replace(/'/g,"\\'");const sG=(firstOption.gloss||'').replace(/'/g,"\\'");const sV=(firstSize.volume||'').replace(/'/g,"\\'");const sF=(firstSize.fill||'').replace(/'/g,"\\'");const sP=(product.photo||'').replace(/'/g,"\\'");h+='<button onclick="addProductToCart(\''+firstOption.sku+'\', \''+sB+'\', \''+sN+'\', '+price+', \''+sC+'\', \''+sG+'\', \''+sV+'\', \''+sF+'\', \''+sP+'\')">В корзину</button>'}h+='</div>';body.innerHTML=h}
function closeProductModalAccount(){document.getElementById('t-product-modal').classList.remove('active');document.body.style.overflow=''}
function addProductToCart(sku,brand,name,price,color,gloss,volume,fill,photo){let cart=[];try{cart=JSON.parse(localStorage.getItem('colormsk_cart')||'[]')}catch(e){}const key=sku+(color?'|'+color:'')+(gloss?'|'+gloss:'');const ex=cart.find(c=>c.key===key);if(ex)ex.qty+=1;else cart.push({key,brand,name,sku,price,color,gloss,volume,fill,photo,qty:1});localStorage.setItem('colormsk_cart',JSON.stringify(cart));closeProductModalAccount();if(confirm('Товар добавлен в корзину.\n\nПерейти на главную?'))window.location.href='/colormsk-test/'}
function formatOrderItem(order,it,idx){const p=[];if(it.color)p.push(it.color);if(it.gloss)p.push(it.gloss);if(it.volume)p.push(it.volume);const pr=(it.price||0)*(it.qty||1);const se=(it.sku||'').replace(/'/g,"\\'");const ph=it.photo?'<div class="t-item-photo"><img src="'+it.photo+'" onerror="this.parentElement.innerHTML=\'<span class=&quot;t-item-photo-placeholder&quot;>—</span>\'"></div>':'<div class="t-item-photo"><span class="t-item-photo-placeholder">—</span></div>';return`<div class="t-order-item" id="item-${order.id}-${idx}"><div class="t-item-info" onclick="openProductModal('${se}')">${ph}<div class="t-item-body"><div class="t-item-name">${(it.brand||'')} ${(it.name||'')}</div>${p.length?'<div class="t-item-params">'+p.join(' · ')+'</div>':''}<div class="t-item-sku">Артикул: ${it.sku||'—'}</div></div></div><div class="t-item-controls"><div class="t-qty"><button id="minus-${order.id}-${idx}" onclick="event.stopPropagation(); changeQty('${order.id}', ${idx}, -1)" ${it.qty<=1?'disabled':''}>−</button><span id="qty-${order.id}-${idx}">${it.qty}</span><button onclick="event.stopPropagation(); changeQty('${order.id}', ${idx}, 1)">+</button></div><div class="t-item-price" id="price-${order.id}-${idx}">${pr.toLocaleString('ru-RU')} ₽</div><button class="t-item-remove" onclick="event.stopPropagation(); removeItem('${order.id}', ${idx})" title="Удалить">✕</button></div></div>`}
function formatOrder(order,num){const status=order.status||'processing';let st='В обработке';let sc='t-status-processing';if(status==='done'){st='Выполнен';sc='t-status-done'}else if(status==='canceled'){st='Отменён';sc='t-status-canceled'}const items=accountState.items[order.id]||[];const vi=items.filter(it=>!it.removed);const ih=vi.map(it=>{const ri=items.indexOf(it);return formatOrderItem(order,it,ri)}).join('');const tot=calcOrderTotal(order.id);const ha=vi.length>0;const ds=order.address?`<div style="font-size:12px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);">Доставка: ${order.address}</div>`:'';return`<div class="t-order" id="order-${order.id}"><div class="t-order-head"><span class="t-order-num">Заказ № ${num}</span><span class="t-order-date">${order.date||'—'}</span><span class="t-order-status ${sc}">${st}</span></div>${ih||'<div style="padding:16px 0;color:var(--muted);font-size:13px;text-align:center;">Все позиции удалены</div>'}${ds}<div class="t-order-total">Итого: <span id="total-${order.id}">${tot.toLocaleString('ru-RU')} ₽</span></div><div class="t-order-actions">${ha?`<button class="t-btn t-btn-repeat" onclick="repeatOrder('${order.id}')">Повторить заказ</button>`:''}</div></div>`}
async function hydrateMissingPhotos(){const tasks=[];Object.keys(accountState.items).forEach(orderId=>{(accountState.items[orderId]||[]).forEach((it,idx)=>{if(it.removed)return;if(!it.photo&&it.sku){tasks.push((async()=>{const f=await findProductBySku(it.sku);if(f&&f.product.photo){it.photo=f.product.photo;const iw=document.querySelector(`#item-${orderId}-${idx} .t-item-photo`);if(iw){iw.innerHTML='<img src="'+it.photo+'" onerror="this.parentElement.innerHTML=\'<span class=&quot;t-item-photo-placeholder&quot;>—</span>\'">'}}})())}})});await Promise.all(tasks)}
async function renderOrders(){const user=getCurrentUser();const list=document.getElementById('t-orders-list');if(!user){list.innerHTML='<div class="t-empty"><div class="t-empty-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg></div><div>Вы не авторизованы</div><div style="margin-top:8px;font-size:13px;color:var(--text-light);">Войдите на главной странице, чтобы увидеть заказы</div><a href="/colormsk-test/" class="t-back-btn">Вернуться на главную</a></div>';return}list.innerHTML='<div class="t-empty">Загрузка заказов...</div>';const all=await loadOrdersFromWorker();const uo=all.filter(o=>o.userId===user.id||(o.userEmail&&user.email&&o.userEmail===user.email));if(uo.length===0){list.innerHTML='<div class="t-empty"><div class="t-empty-icon"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg></div><div>У вас пока нет заказов</div><div style="margin-top:8px;font-size:13px;color:var(--text-light);">Оформите первый заказ из каталога</div><a href="/colormsk-test/" class="t-back-btn">Перейти в каталог</a></div>';return}accountState.allOrders=all;accountState.orders=uo;accountState.items={};uo.forEach(o=>{accountState.items[o.id]=(o.items||[]).map(it=>({...it,qty:it.qty||1,removed:false}))});const sorted=uo.slice().reverse();list.innerHTML=sorted.map((o,i)=>formatOrder(o,sorted.length-i)).join('');await hydrateMissingPhotos()}
document.addEventListener('click',e=>{const m=document.getElementById('t-product-modal');if(m&&e.target===m)closeProductModalAccount()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeProductModalAccount()});
(async function init(){const user=getCurrentUser();if(user){document.getElementById('t-account-name').textContent=user.name||'Пользователь';document.getElementById('t-account-email').textContent=user.email||'—';document.getElementById('t-account-phone').textContent=user.phone||'—'}await renderOrders()})();
</script>
